{% extends "base.html" %}
{% block content %}
<h3>Add Policy Holder (NIDA Validation)</h3>
<form method="POST" class="card p-4">
  <input class="form-control mb-2" name="full_name" placeholder="Full Name" required>
  <input class="form-control mb-2" name="nida" placeholder="NIDA - 20 digits" maxlength="20" required>
  <small class="text-muted mb-2">Format: YYYYMMDD-XXXXX-XXXXX-XX</small>
  <input class="form-control mb-2" name="phone" placeholder="Phone 07XXXXXXXX">
  <input class="form-control mb-3" name="email" placeholder="Email">
  <button class="btn btn-primary">Save Holder</button>
</form>
{% endblock %}
